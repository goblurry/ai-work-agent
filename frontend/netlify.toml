# Netlify 배포 설정.
# Vite 의 server.proxy 는 개발 전용이라 빌드 결과에 포함되지 않는다.
# 배포본에서도 /api 가 백엔드로 가도록 같은 출처 프록시를 둔다.

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# status = 200 은 리다이렉트가 아니라 프록시(재작성)다.
# 브라우저 주소는 그대로 두고 응답만 백엔드에서 가져오므로
# 같은 출처로 취급되어 로그인 쿠키가 그대로 동작한다.
[[redirects]]
  from   = "/api/*"
  to     = "https://goblurry-academic-ai-agent.hf.space/:splat"
  status = 200
  force  = true
